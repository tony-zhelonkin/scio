# craft.yaml — single source of truth for the SCIO:CRAFT managed block.
#
# Rendered into each repo's AGENTS.md by `scio craft` as the
# <!-- BEGIN SCIO:CRAFT --> block. Edit here once; run `scio craft` in
# each repo to propagate. The block states the standing conventions; numeric
# values an analysis reads live in analysis_config.yaml (figures:).
#
# `max_lines:` is the budget for the rendered body — depth belongs in skills,
# not always-on text. `scio lint --check toolkit` enforces it.
# `floors:` are display values substituted into {{tokens}} in body below.
# `body:` MUST be the last top-level key (block.sh reads it as a block scalar).

version: 1
max_lines: 25

floors:
  figure_base_size: 14          # one legible tier — base font floor (pt)
  context_budget_pct: 35        # one phase ~= this share of a 200k context
  review_every: 3               # Opus review cadence (phases)

body: |
  # Craft standards

  Toolkit-managed standing conventions for this repo — do not hand-edit.

  - **Figures** — legible both shrunk in a journal column and projected to the back of a room: bigger, fewer, bolder (one legible tier, base >= {{figure_base_size}}pt; one plot object emits a vector PDF + a raster PNG). Style only via the project theme entry point (inline `theme()`/`ggsave(width=)`/raw hex are banned); cap to top-N; keep axis labels whole; disambiguate glyphs; prefer the residualized channel.
  - **Results** — every artifact under `03_results/<stage>/{figures,tables}/` with `by_contrast/<c>/` + `_overview/`; a figure's source table is its same-stem neighbor.
  - **README** — a task is unfinished until the sibling `README.md` captions every `03_results/` file you create, edit, or delete, including *how to read* it (glyphs, sign convention, Δρ, claim tier).
  - **Planning** — a phased plan lives in `docs/_internal/_project/plans/{date-slug}/` as `00_INDEX.md` + `NN_<slug>.md`; one phase == one stage == one implementer (~{{context_budget_pct}}% of context); every {{review_every}} phases, review that the code runs and produces its artifacts.
  - **Code shape** — `02_analysis/{config,helpers,stages,notebooks}`. A stage (`stages/NN_<topic>.R`) is narrative: it reads top-to-bottom as the dataset's story; its viz twin `NN_<topic>_viz` shares the number and stem and owns the figures — compute writes tables, viz writes figures. Number by decades: `00`–`09` preliminaries, `10`/`20`/`30` acts, `11`–`19` beats within an act; letter suffixes are banned. Implementation lives behind named APIs in `helpers/`: stages source helper entry points and call them in story order; carve functions out unless the detail *is* the narrative (a model's training spec), and mark that case `# stage-detail: <reason>` (skill: `analysis-code-conventions`).
  - **Bulk RNA-seq** — R code calls the installed `bulkiRNA` package: `library(bulkiRNA)`, then `bulkirna_api()` for its exports. Ingest, annotation, DGEList, DE figures, gene-set databases, tests and figures are package functions; a project helper wraps an export and names the gap it fills (skill: bulkirna).
  - **Exploration** — looking at what a stage produced is either a live-kernel Python `.qmd` at `02_analysis/notebooks/<NN>_<stage>_explore/` that brushes jscatter panels over compact parquet exported to `03_results/interactive/`, or a rendered read-only Quarto/R notebook at `<NN>_<stage>_review/` that re-plots the numbers as committed GFM + PNGs. Ask the user which, and what they need to see, before scaffolding. Both are read-only and latch nothing; the reading you reach lands in a stage-keyed note (skill: notebook-exploration).
  - **Annotation campaigns** — relabelling across many rounds uses one marimo notebook with a selection manifest under `03_results/interactive/selections/`, barcodes as the only stable key, and a deterministic path from saved selections to a cleaned roster (skill: notebook-annotation).
  - **Reproducibility & memory** — every `03_results/` artifact is reproducible from a committed `02_analysis/stages/NN_*`. Durable project memory lives in tracked files alone — `AGENTS.md`, committed stages, and stage-keyed notes under `docs/_internal/<stage-stem>/`: `<topic>.md` before you proceed past a decision, `session.md` is always the current one and `session-history/<UTC timestamp>.md` what it superseded, `_project/` for what spans stages. A directory arrives with its first real file. Harness auto-memory is off (`autoMemoryEnabled`) and untracked harness state counts as no record.
  - **Verification** — predict the observable result before each non-trivial run; after substantive explanations, check understanding with a restatement or small conceptual challenge; at every transformation, propose the next concrete sanity check and verify uncertainty before proceeding.
  - **Response shape** — lead with the answer; use active grammar and first person for judgment; define terms operationally; keep prose conversational and formatting sparse; use ASCII only when it clarifies structure; close substantive replies with a portable line.
  - **Axioms** — mark crisp, exception-free invariants whose consequential asymmetry predicts a concrete failure. Phrase each as a short, quotable operation plus breakage and emit it only when the failure is easy to picture. Apply freely to designed code and formal systems; treat biological framings as useful first-pass models that may leak.
  - **Prose** — state what a thing *is*. Cut contrastive negation ("a receptor lens over the same cohort, *not* a new dataset"; the reflexive "X, not Y") down to the positive claim, keeping a "not Y" clause only where the contrast is logically load-bearing and reads cleanly.
  - **Comments** — state intent: what the code is *for*, the design goal, the expected result. One line when one line suffices; a docstring adds the contract (guarantees, refusals) and stops there. History, provenance, and detail the code already shows stay out — a comment that dies in a rewrite documented an incident. Banners and separator rules (`# =====`, `# -----`) are banned, as is a stacked multi-line block mid-function: intent needing six lines mid-body means the code needs a named helper.
